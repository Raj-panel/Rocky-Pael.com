<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Boost Panel</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="main-wrapper">
        <!-- Platform Selector Switch -->
        <div class="platform-switch-container">
            <button class="platform-btn active" id="btnInsta" onclick="switchPlatform('instagram')">
                <i class="fa-brands fa-instagram"></i> Instagram
            </button>
            <button class="platform-btn" id="btnFb" onclick="switchPlatform('facebook')">
                <i class="fa-brands fa-facebook"></i> Facebook
            </button>
        </div>

        <!-- Hero Status Banner -->
        <div class="hero-banner">
            <div class="hero-top-row">
                <div class="hero-logo-box" id="heroLogoIcon">
                    <i class="fa-brands fa-instagram"></i>
                </div>
                <span class="provider-badge">#1 Service Provider</span>
            </div>
            <h2 id="heroTitle">Instagram Boost</h2>
            <p class="hero-sub">Real engagement delivered fast & safely</p>

            <div class="hero-stats-grid">
                <div class="stat-card">
                    <span class="stat-icon"><i class="fa-solid fa-rocket"></i></span>
                    <span class="stat-num" id="totalOrders">20M+</span>
                    <span class="stat-lbl">Delivered</span>
                </div>
                <div class="stat-card">
                    <span class="stat-icon"><i class="fa-solid fa-headset"></i></span>
                    <span class="stat-num">24/7</span>
                    <span class="stat-lbl">Support</span>
                </div>
                <div class="stat-card">
                    <span class="stat-icon"><i class="fa-solid fa-shield-halved"></i></span>
                    <span class="stat-num">100%</span>
                    <span class="stat-lbl">Safe</span>
                </div>
            </div>
        </div>

        <!-- Scrollable Service Category Tabs -->
        <div class="category-tabs-wrapper">
            <div class="category-tabs" id="categoryTabs">
                <!-- JavaScript will dynamically render categories here -->
            </div>
        </div>

        <!-- Package List Section -->
        <div class="package-list-container" id="packageList">
            <!-- Dynamic Service Cards Will Appear Here -->
        </div>

        <!-- Link & Checkout Modal / Drawer -->
        <div class="checkout-card" id="checkoutSection" style="display: none;">
            <div class="checkout-header">
                <h3><i class="fa-solid fa-cart-shopping"></i> Complete Your Order</h3>
            </div>
            <div class="order-summary-pill" id="selectedSummary"></div>

            <div class="input-box">
                <label id="linkInputLabel">Enter Profile / Post Link:</label>
                <input type="text" id="link" placeholder="https://instagram.com/username">
            </div>

            <button class="action-btn" onclick="generateOrder()">Proceed to Payment <i class="fa-solid fa-arrow-right"></i></button>

            <!-- Payment Gateway Details -->
            <div class="payment-card" id="paymentCard" style="display: none;">
                <div class="pay-toggle-tabs">
                    <button class="pay-tab active" id="tabUpi" onclick="switchPaymentMethod('upi')">
                        <i class="fa-solid fa-qrcode"></i> UPI / QR Code
                    </button>
                    <button class="pay-tab" id="tabBinance" onclick="switchPaymentMethod('binance')">
                        <i class="fa-solid fa-coins"></i> Crypto (USDT)
                    </button>
                </div>

                <!-- UPI View -->
                <div id="upiPaymentView" class="qr-box">
                    <img id="qrCodeImg" src="" alt="Payment QR Code">
                    <p class="qr-sub">Scan QR using GPay, PhonePe, Paytm, or BHIM</p>
                </div>

                <!-- Binance View -->
                <div id="binancePaymentView" style="display: none;">
                    <div class="binance-info-card">
                        <p class="info-row">Pay via USDT (TRC20 / BEP20)</p>
                        <span class="usdt-badge" id="binanceUsdtDisplay">$0.00 USDT</span>
                    </div>
                </div>

                <div class="input-box margin-top-15">
                    <label id="utrLabel">Enter 12-Digit UPI UTR / Ref No:</label>
                    <input type="text" id="utrNumber" placeholder="e.g. 4029XXXXXXXX (12-Digit UTR)">
                </div>

                <button class="whatsapp-submit-btn" onclick="confirmPaymentWithUTR()">
                    <i class="fa-brands fa-whatsapp"></i> Confirm Order on WhatsApp
                </button>
            </div>
        </div>

        <div class="footer-note">
            ⚡ Fast Processing • 100% Refund Guarantee If Failed
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
