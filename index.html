<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMM Panel - Easy Order</title>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #151c2c;
            --accent-gradient: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
            --fb-color: #1877f2;
            --text-color: #ffffff;
            --text-muted: #94a3b8;
            --border-color: #2a3447;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding-bottom: 70px;
        }

        /* Top Hero Header */
        .hero-card {
            background: linear-gradient(135deg, #833ab4, #fd1d1d, #fcb045);
            margin: 15px;
            padding: 20px;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }

        .hero-card h2 {
            font-size: 20px;
            margin-bottom: 5px;
        }

        .hero-stats {
            display: flex;
            justify-content: space-around;
            margin-top: 15px;
            background: rgba(0, 0, 0, 0.2);
            padding: 10px;
            border-radius: 12px;
            font-size: 12px;
        }

        /* Platform Selector (Instagram / Facebook) */
        .platform-tabs {
            display: flex;
            gap: 10px;
            margin: 0 15px 15px 15px;
        }

        .platform-btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 12px;
            background: var(--card-bg);
            color: var(--text-muted);
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            border: 2px solid transparent;
            transition: all 0.3s ease;
        }

        .platform-btn.active-insta {
            background: var(--accent-gradient);
            color: white;
            border-color: transparent;
        }

        .platform-btn.active-fb {
            background: var(--fb-color);
            color: white;
            border-color: transparent;
        }

        /* Sub Category Tabs */
        .category-tabs {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding: 0 15px 15px 15px;
            scrollbar-width: none;
        }

        .category-tabs::-webkit-scrollbar {
            display: none;
        }

        .cat-btn {
            padding: 8px 16px;
            background: var(--card-bg);
            color: var(--text-muted);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            white-space: nowrap;
            cursor: pointer;
            font-size: 14px;
        }

        .cat-btn.active {
            background: #ffffff;
            color: #000000;
            font-weight: bold;
        }

        /* Service List Container */
        .service-list {
            padding: 0 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .service-item {
            background: var(--card-bg);
            border-radius: 14px;
            padding: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border: 1px solid var(--border-color);
        }

        .service-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .service-icon {
            font-size: 28px;
        }

        .insta-icon {
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .fb-icon {
            color: var(--fb-color);
        }

        .service-details h4 {
            font-size: 15px;
            margin-bottom: 4px;
        }

        .service-details p {
            font-size: 12px;
            color: var(--text-muted);
        }

        .badge {
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 6px;
            margin-left: 5px;
            font-weight: bold;
        }

        .badge-popular { background: #6366f1; color: #fff; }
        .badge-discount { background: #ef4444; color: #fff; }

        .price-btn {
            background: var(--accent-gradient);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
        }

        .price-btn-fb {
            background: var(--fb-color);
        }

        /* Bottom Nav Bar */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--card-bg);
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            border-top: 1px solid var(--border-color);
        }

        .nav-item {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .nav-item.active {
            color: #22c55e;
        }
    </style>
</head>
<body>

    <!-- Header Banner -->
    <div class="hero-card" id="hero-banner">
        <h2>Grow Your Instagram Today!</h2>
        <p style="font-size: 12px;">Real • Active IND • High Quality</p>
        <div class="hero-stats">
            <div>🚀 50M+<br><span style="color:#ddd">Delivered</span></div>
            <div>🎧 24/7<br><span style="color:#ddd">Support</span></div>
            <div>🛡️ 100%<br><span style="color:#ddd">Safe</span></div>
        </div>
    </div>

    <!-- Main Platform Selector -->
    <div class="platform-tabs">
        <button class="platform-btn active-insta" id="btn-insta" onclick="selectPlatform('instagram')">
            <i class="fa-brands fa-instagram"></i> Instagram
        </button>
        <button class="platform-btn" id="btn-fb" onclick="selectPlatform('facebook')">
            <i class="fa-brands fa-facebook"></i> Facebook
        </button>
    </div>

    <!-- Sub Categories Filter Tabs -->
    <div class="category-tabs" id="category-container">
        <!-- Categories will load dynamically -->
    </div>

    <!-- Service Card Items -->
    <div class="service-list" id="service-container">
        <!-- Services will load dynamically -->
    </div>

    <!-- Bottom Navigation -->
    <div class="bottom-nav">
        <a href="#" class="nav-item"><i class="fa-solid fa-list"></i> My Orders</a>
        <a href="#" class="nav-item active"><i class="fa-solid fa-plus-circle" style="font-size: 20px;"></i> New Order</a>
        <a href="#" class="nav-item"><i class="fa-solid fa-bars"></i> Menu</a>
    </div>

    <script>
        // Database Of Services
        const data = {
            instagram: {
                title: "Grow Your Instagram Today!",
                categories: ["Followers", "Likes", "Post View", "Comments", "Share", "Repost"],
                services: [
                    { id: 1, cat: "Followers", name: "100 Followers", desc: "⚡ High Quality • Instant Complete", price: "₹20", badge: "" },
                    { id: 2, cat: "Followers", name: "1K Followers", desc: "⚡ Real Active • Fast Speed", price: "₹149", badge: "Popular" },
                    { id: 3, cat: "Likes", name: "100 Like (Demo)", desc: "⚡ Instant Complete", price: "₹15", badge: "" },
                    { id: 4, cat: "Likes", name: "10K Like", desc: "⚡ High Quality Instant", price: "₹299", badge: "Popular" },
                    { id: 5, cat: "Post View", name: "1K Post View", desc: "⚡ High Speed Instant", price: "₹10", badge: "" },
                    { id: 6, cat: "Post View", name: "500K Post View", desc: "⚡ Ultra Fast", price: "₹1499", badge: "Discounted" },
                    { id: 7, cat: "Comments", name: "50 Comment", desc: "🇮🇳 Real Indian Comment", price: "₹29", badge: "" },
                    { id: 8, cat: "Share", name: "100 Share", desc: "🚀 More Share, More Reached", price: "₹15", badge: "" },
                    { id: 9, cat: "Repost", name: "50 Repost", desc: "♻️ More Reach", price: "₹29", badge: "" }
                ]
            },
            facebook: {
                title: "Grow Your Facebook Today!",
                categories: ["Page Likes", "Profile Followers", "Video Views", "Post Reaction"],
                services: [
                    { id: 101, cat: "Page Likes", name: "1000 Page Likes", desc: "👍 Real Active Users", price: "₹199", badge: "Popular" },
                    { id: 102, cat: "Profile Followers", name: "5000 Followers", desc: "👤 Instant Start", price: "₹499", badge: "Discounted" },
                    { id: 103, cat: "Video Views", name: "10K Video Views", desc: "🎥 Watch Time Boost", price: "₹250", badge: "" },
                    { id: 104, cat: "Post Reaction", name: "500 Love Reactions", desc: "❤️ High Quality", price: "₹80", badge: "" }
                ]
            }
        };

        let currentPlatform = 'instagram';
        let currentCategory = 'Followers';

        // Select Platform (Instagram or Facebook)
        function selectPlatform(platform) {
            currentPlatform = platform;
            
            const btnInsta = document.getElementById('btn-insta');
            const btnFb = document.getElementById('btn-fb');
            const heroBanner = document.getElementById('hero-banner');

            if(platform === 'instagram') {
                btnInsta.className = 'platform-btn active-insta';
                btnFb.className = 'platform-btn';
                heroBanner.style.background = 'linear-gradient(135deg, #833ab4, #fd1d1d, #fcb045)';
                heroBanner.querySelector('h2').innerText = data.instagram.title;
                currentCategory = data.instagram.categories[0];
            } else {
                btnFb.className = 'platform-btn active-fb';
                btnInsta.className = 'platform-btn';
                heroBanner.style.background = 'linear-gradient(135deg, #1877f2, #0052d4)';
                heroBanner.querySelector('h2').innerText = data.facebook.title;
                currentCategory = data.facebook.categories[0];
            }

            renderCategories();
            renderServices();
        }

        // Render Sub-Categories Tabs
        function renderCategories() {
            const catContainer = document.getElementById('category-container');
            const categories = data[currentPlatform].categories;

            catContainer.innerHTML = categories.map(cat => `
                <button class="cat-btn ${cat === currentCategory ? 'active' : ''}" onclick="selectCategory('${cat}')">
                    ${cat}
                </button>
            `).join('');
        }

        // Filter Category
        function selectCategory(cat) {
            currentCategory = cat;
            renderCategories();
            renderServices();
        }

        // Render Service Cards
        function renderServices() {
            const serviceContainer = document.getElementById('service-container');
            const allServices = data[currentPlatform].services;
            
            // Filter services based on current category
            const filteredServices = allServices.filter(s => s.cat === currentCategory);

            const iconClass = currentPlatform === 'instagram' ? 'fa-brands fa-instagram insta-icon' : 'fa-brands fa-facebook fb-icon';
            const btnClass = currentPlatform === 'instagram' ? 'price-btn' : 'price-btn price-btn-fb';

            if(filteredServices.length === 0) {
                serviceContainer.innerHTML = `<p style="text-align:center; padding: 20px; color: var(--text-muted);">No services available in this category.</p>`;
                return;
            }

            serviceContainer.innerHTML = filteredServices.map(item => `
                <div class="service-item">
                    <div class="service-info">
                        <i class="${iconClass} service-icon"></i>
                        <div class="service-details">
                            <h4>
                                ${item.name}
                                ${item.badge ? `<span class="badge ${item.badge === 'Popular' ? 'badge-popular' : 'badge-discount'}">${item.badge}</span>` : ''}
                            </h4>
                            <p>${item.desc}</p>
                        </div>
                    </div>
                    <button class="${btnClass}" onclick="orderService('${item.name}')">${item.price}</button>
                </div>
            `).join('');
        }

        // Order Handler Function
        function orderService(serviceName) {
            alert(`আপনি সিলেক্ট করেছেন: ${serviceName}\nএখন এটি কেনাকাটার পেজে চলে যাবে।`);
        }

        // Initial Load (Default Instagram Setup)
        window.onload = function() {
            selectPlatform('instagram');
        };
    </script>
</body>
</html>
