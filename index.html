<!-- Payment Gateway Details -->
            <div class="payment-card" id="paymentCard" style="display: none;">
                <div class="pay-toggle-tabs">
                    <button class="pay-tab active" id="tabUpi" onclick="switchPaymentMethod('upi')">
                        <i class="fa-solid fa-qrcode"></i> UPI QR Code
                    </button>
                    <button class="pay-tab" id="tabBinance" onclick="switchPaymentMethod('binance')">
                        <i class="fa-solid fa-wallet"></i> Binance Pay
                    </button>
                </div>

                <!-- UPI Payment View -->
                <div id="upiPaymentView" class="qr-box">
                    <div class="qr-container">
                        <img id="qrCodeImg" src="" alt="UPI Payment QR Code">
                        <p class="qr-sub">Scan & Pay Exact Amount with GPay / PhonePe / Paytm</p>
                    </div>
                </div>

                <!-- Binance Pay / USDT View -->
                <div id="binancePaymentView" style="display: none;" class="qr-box">
                    <div class="qr-container">
                        <img src="binance-qr.png" alt="Binance QR Code" class="binance-qr-img">
                        
                        <div class="binance-nickname-box">
                            Binance Nickname: <span>Alex-Sahil786</span>
                        </div>

                        <div class="usdt-badge-pill" id="usdtAmountDisplay">$0.00 USDT</div>
                        <p class="qr-sub">Scan QR Code using Binance App to Pay USDT</p>
                    </div>
                </div>

                <!-- UTR / TxID Input Box -->
                <div class="input-box margin-top-15">
                    <label id="utrLabel"><i class="fa-solid fa-receipt"></i> Enter 12–Digit UPI UTR / Ref No:</label>
                    <input type="text" id="utrNumber" placeholder="e.g. 4029XXXXXXXX (12–Digit UTR)">
                </div>

                <!-- Yellow Alert Banner -->
                <div class="payment-alert-box">
                    ⚠️ After completing payment, enter the UTR / TxID and submit your order on WhatsApp.
                </div>

                <!-- WhatsApp Submit Button -->
                <button class="whatsapp-submit-btn" onclick="confirmPaymentWithUTR()">
                    <i class="fa-brands fa-whatsapp"></i> Submit Order on WhatsApp
                </button>
            </div>
